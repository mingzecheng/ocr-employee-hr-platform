server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hr-platform-server
  datasource:
    # Read/write split: master handles writes, replica handles reads. In the demo/dev environment
    # both default to the same MySQL instance; production points MYSQL_REPLICA_URL at a real replica.
    master:
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hr_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${MYSQL_USERNAME:hr}
      password: ${MYSQL_PASSWORD:change-me-application-password}
      driver-class-name: com.mysql.cj.jdbc.Driver
    replica:
      url: ${MYSQL_REPLICA_URL:${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hr_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}}
      username: ${MYSQL_REPLICA_USERNAME:${MYSQL_USERNAME:hr}}
      password: ${MYSQL_REPLICA_PASSWORD:${MYSQL_PASSWORD:change-me-application-password}}
      driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    placeholders:
      demoAccountsEnabled: ${PLATFORM_DEMO_ACCOUNTS_ENABLED:true}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

management:
  endpoints:
    web:
      exposure:
        include: health,info

platform:
  demo-accounts-enabled: ${PLATFORM_DEMO_ACCOUNTS_ENABLED:true}
  security:
    live-jwt-validation: ${PLATFORM_LIVE_JWT_VALIDATION:true}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-before-sharing-please}
    expiration: ${JWT_EXPIRATION:PT8H}
  ocr:
    base-url: ${OCR_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${OCR_INTERNAL_TOKEN:local-ocr-internal-token}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:change-me-minio-password}
    bucket: ${MINIO_BUCKET:hr-platform}
