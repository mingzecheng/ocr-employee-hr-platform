server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hr-platform-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hr_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:hr}
    password: ${MYSQL_PASSWORD:change-me-application-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

management:
  endpoints:
    web:
      exposure:
        include: health,info

platform:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-before-sharing-please}
    expiration: ${JWT_EXPIRATION:PT8H}
  ocr:
    base-url: ${OCR_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${OCR_INTERNAL_TOKEN:local-ocr-internal-token}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:change-me-minio-password}
    bucket: ${MINIO_BUCKET:hr-platform}
