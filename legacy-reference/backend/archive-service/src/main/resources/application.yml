spring:
  application:
    name: archive-service
  profiles:
    default: local
  flyway:
    enabled: true
  main:
    allow-bean-definition-overriding: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: ${ARCHIVE_PORT:8082}

mybatis:
  mapper-locations: classpath:/mapper/*.xml

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:local-development-secret-change-me-please-32}
    issuer: ${SECURITY_JWT_ISSUER:hr-platform}
    access-token-ttl: ${SECURITY_JWT_ACCESS_TOKEN_TTL:30m}

app:
  datasource:
    write:
      url: ${MYSQL_WRITE_URL:jdbc:mysql://127.0.0.1:3306/archive_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${MYSQL_USERNAME:hr}
      password: ${MYSQL_PASSWORD:hr-password}
      maximum-pool-size: ${MYSQL_WRITE_POOL_SIZE:10}
      minimum-idle: ${MYSQL_WRITE_MIN_IDLE:2}
    read:
      url: ${MYSQL_READ_URL:jdbc:mysql://127.0.0.1:3307/archive_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${MYSQL_USERNAME:hr}
      password: ${MYSQL_PASSWORD:hr-password}
      maximum-pool-size: ${MYSQL_READ_POOL_SIZE:10}
      minimum-idle: ${MYSQL_READ_MIN_IDLE:2}

archive:
  max-file-size-bytes: ${ARCHIVE_MAX_FILE_SIZE_BYTES:10485760}
  storage-prefix: ${ARCHIVE_STORAGE_PREFIX:archive}
  ocr-service-url: ${OCR_SERVICE_URL:http://127.0.0.1:8000}
  ocr-connect-timeout: ${ARCHIVE_OCR_CONNECT_TIMEOUT:3s}
  ocr-read-timeout: ${ARCHIVE_OCR_READ_TIMEOUT:120s}
  ocr-internal-token: ${OCR_INTERNAL_TOKEN:local-ocr-internal-token}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:change-me-minio-password}
    bucket: ${MINIO_BUCKET:hr-platform}

management:
  endpoints:
    web:
      exposure:
        include: health,info
