spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/auth/**
        - id: identity-departments
          uri: ${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/departments/**
        - id: archive-employees
          uri: ${ARCHIVE_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/employees/**
        - id: archive-api
          uri: ${ARCHIVE_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/archive/**
        - id: archive-statistics
          uri: ${ARCHIVE_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/statistics/**
        - id: workflow-requests
          uri: ${WORKFLOW_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/hr-requests/**
        - id: workflow-approvals
          uri: ${WORKFLOW_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/approvals/**
        - id: workflow-access
          uri: ${WORKFLOW_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/archive-access-applications/**
        - id: workflow-uses
          uri: ${WORKFLOW_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/archive-uses/**
        - id: workflow-inventory
          uri: ${WORKFLOW_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/inventory-tasks/**
        - id: workflow-todos
          uri: ${WORKFLOW_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/todos/**

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
