[project]
name = "local-ocr-service"
version = "0.1.0"
description = "Local OCR API for employee archive workflows"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<12",
  "paddlepaddle==3.3.0",
  "paddleocr>=3.0,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
